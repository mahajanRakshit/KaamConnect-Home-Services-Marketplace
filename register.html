<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | KaamConnect</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page">
<header class="navbar"><a href="index.html" class="logo">Kaam<span>Connect</span></a><a href="index.html" class="nav-btn">Back to Home</a></header>
<main class="auth-wrap"><form id="registerForm" class="form-card auth-card"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create an Account</h1>
<label>Register As<select id="role" required><option value="customer">Customer</option><option value="worker">Service Worker</option></select></label>
<label>Full Name<input type="text" id="name" required maxlength="70" placeholder="Your full name"></label><label>Email Address<input type="email" id="email" required placeholder="you@example.com"></label><label>Phone Number<input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="10-digit mobile number"></label><label>Password<input type="password" id="password" minlength="6" required placeholder="At least 6 characters"></label>
<button class="primary-btn" type="submit">Create Account</button><p id="registerMessage" role="status"></p><p class="login-link">Already registered? <a href="login.html">Login here</a></p></form></main><script src="js/auth.js"></script></body></html>
